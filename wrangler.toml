name = "apple-pickup-watch"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Preserve variables edited in Cloudflare Dashboard across Git deployments.
keep_vars = true

# Wake every minute; CHECK_INTERVAL_MINUTES controls real query frequency.
[triggers]
crons = ["* * * * *"]

# Durable Object: one Room instance holds all browser SSE subscribers +
# last-known availability state.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Workers Free requires SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true

# Static assets served from /public; serve the dashboard HTML at /.
[assets]
directory = "./public"
binding = "ASSETS"