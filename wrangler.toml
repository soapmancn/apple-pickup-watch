name = "apple-pickup-watch"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Cron trigger: every 2 minutes (Workers free plan allows cron ≥ 1 min).
# Trigger also activates cold-starts so DO has fresh data on tab open.
[triggers]
crons = ["*/2 * * * *"]

# Durable Object: one Room instance holds all browser SSE subscribers +
# last-known availability state.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Workers Free requires SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true

# Static assets served from /public; serve the dashboard HTML at /.
[assets]
directory = "./public"
binding = "ASSETS"